awordergrid_index:
  path: /awordergrid/index
  methods: [GET]
  defaults:
    _controller: 'Axelweb\AwOrderGrid\Controller\AwOrderGridController::index'
    # Needed to work with tab system
    _legacy_controller: AwOrderGrid
    _legacy_link: AwOrderGrid

awordergrid_form_configuration:
  path: /awordergrid/configuration
  methods: [GET, POST]
  defaults:
    _controller: 'Axelweb\AwOrderGrid\Controller\AdminConfigurationController::index'
    # Needed to work with tab system
    _legacy_controller: AdminAwOrderGrid
    _legacy_link: AdminAwOrderGrid
